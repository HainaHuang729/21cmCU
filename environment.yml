# Conda environment for the 21cmFAST v3 pipeline (Linux x86_64 + CUDA).
# See v4/README.md for the 21cmFAST 4.3.2 adapter setup.
# Usage:
#   conda env create -f environment.yml
#   conda activate 21cmfast-gpu
#   pip install cupy-cuda12x   # or cupy-cuda11x for CUDA 11.x hosts
name: 21cmfast-gpu
channels:
  - conda-forge
dependencies:
  - python=3.10
  - gsl
  - fftw
  - c-compiler
  - openmp
  - numpy>=1.24,<2
  - scipy
  - h5py
  - astropy>=6,<7
  - cffi
  - attrs
  - pyyaml
  - click
  - cached-property
  - psutil
  - bidict
  - pip
