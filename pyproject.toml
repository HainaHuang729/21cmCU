[build-system]
requires = ["setuptools>=78.1.0", "cffi>=1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "21cmCU"
version = "0.6.0"
description = "21cmCU: Native C/CUDA + cuFFT 21cm cosmological simulation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click",
    "numpy>=2.0",
    "pyyaml",
    "cffi>=1.0",
    "scipy",
    "astropy>=2.0",
    "h5py>=2.8.0",
    "matplotlib",
    "bidict",
    "cosmotile>=0.2.5",
    "attrs",
    "tqdm",
    "classy>=3.3.4,<3.4",
    "cyclopts",
    "tomlkit",
    "hmf>=3.6.2",
    "deprecation",
    "packaging",
]

[project.optional-dependencies]
legacy-cupy = ["cupy-cuda12x"]

[project.scripts]
21cmcu = "py21cmcu.cli:app"
21cmfast = "py21cmfast.cli:app"

[project.urls]
Repository = "https://github.com/HainaHuang729/21cmCU"
Upstream = "https://github.com/21cmfast/21cmFAST"

[dependency-groups]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "v4"]
markers = ["gpu: requires a usable CUDA device and CuPy"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
  "*.ipynb",  # include these later
  "devel/filter_valgrind.py",
]

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "E",    # pycodestyle
  "W",    # pycodestyle warning
  "F",    # pyflakes
  "C90",  # mccabe complexity
  "I",    # isort
  "N",    # pep8-naming
  "D",    # docstyle
  # "ANN"   # type annotations
  "B",    # bugbear
  "A",    # builtins
  "C4",   # comprehensions
  "DTZ",  # datetime
  "FA",   # future annotations
  "PIE",  # flake8-pie
  "T",    # print statements
  "PT",   # pytest-style
  "Q",    # quotes
  "SIM",  # simplify
  "PTH",  # use Pathlib
  "ERA",  # kill commented code
  "NPY",  # numpy-specific rules
  "PERF", # performance
  # "FURB", # refurb
  "RUF",  # ruff-specific rules
]
ignore = [
    "DTZ007",   # use %z in strptime
    "DTZ005",
    "E203",
    "E266",
    "E501",
    "F403",
    #"F401",
    "E231",
    # Naming upper/lowercase -- too hard right now.
    "N803",
    # Naming upper/lowercase -- too hard right now.
    "N806",
    # Naming upper/lowercase -- too hard right now.
    "N802",
    # Naming mixed case
    "N815",
    # Docstring in imperative mood. This should *not* be the case for @property's, but can't ignore them atm.
#    "D401",
    # Module shadowing a builtin
    "A005",
    "RUF009",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "D103",  # ignore missing docstring in tests
    "DTZ",   # ignore datetime in tests
    "T",     # print statements
    # `pytest.fixture` is listed in lint.pydocstyle.property-decorators (so that
    # fixtures get the relaxed docstring treatment properties get), but that
    # option is also consulted by PLR0206, which then wrongly treats pytest
    # fixtures as properties and flags their (perfectly normal) parameters.
    "PLR0206",
]
"devel/*.py" = [
  "T",
]
"docs/conf.py" = [
    "A",  # conf.py can shadow builtins
    "ERA",
]
"src/py21cmfast/cli.py" = [
    "D103",  # ignore missing docstrings
    "T",     # print statements
]
"build_cffi.py" = [
    "T",     # print statements
]


[tool.ruff.lint.pydocstyle]
convention = 'numpy'
property-decorators = [
    "property",
    "functools.cached_property",
    "pytest.fixture"
]
[tool.ruff.lint.mccabe]
max-complexity = 20
